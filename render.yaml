# Render Blueprint: deploys the API and the React site together.
# In Render: New + > Blueprint > pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: unitree-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false

  - type: web
    name: unitree-web
    runtime: static
    rootDir: frontend/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
